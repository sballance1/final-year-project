<!DOCTYPE html>
<html lang="en">
<html>
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="fyp.css">
    <title>Sign In</title>
</head>
<body>
    <div id="container">
        <form id="form">         
             <label for="firstName" ><h3>FIRST NAME:</h3></label>
            <input type="text" id="firstName" name="firstName">
            <label for="lastName"><h3>LAST NAME:</h3></label>
            <input type="text" id="lastName" name="lastName">
            <label class="required" for="email"><h3>EMAIL:</h3></label>
            <input type="email" id="email" name="email">
             <label class="required" for="number"><h3>Student Number: <h5>(Must be 8 digits long)</h5></h3></label>
            <input type="text" id="number" name="number">
            <input type="submit" value="SUBMIT">
       
        </form>
    </div>
    <script src="fyp.js"></script>
    <footer class="footer">
        <img src="https://www.maynoothuniversity.ie/sites/default/files/assets/images/Maynooth%20University%20Irish%20Logo%20colour%20black%20text%20350%20x%20146px.png" alt="Maynooth University logo">
        <p class="mb-0">© 2025 Study abroad platform. All rights reserved.</p>
    </footer>
</body>
</html>
